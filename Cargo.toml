[package]
name = "bloxgloom"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/host-api", "extensions/lifecycle-fixture"]

[features]
lifecycle-fixture = ["dep:bloxgloom-lifecycle-fixture"]

[dev-dependencies]
bloxgloom-lifecycle-fixture = { path = "extensions/lifecycle-fixture" }

[dependencies]
bloxgloom-lifecycle-fixture = { path = "extensions/lifecycle-fixture", optional = true }
bloxgloom-host-api = { path = "crates/host-api" }
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "=0.36.2"
egui-wgpu = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard"] }
font8x8 = "0.3.1"
fontdue = "0.9"
getrandom = "0.3"
glam = "0.33.9"
mlua = { version = "0.12.1", features = ["luau", "vendored"] }
png = "0.18.1"
polling = "3.11.0"
pollster = "1.0.1"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
taffy = { version = "0.14", default-features = false, features = ["std", "taffy_tree", "flexbox"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0.1"
winit = "0.30.13"
cpal = "0.18.2"
rtrb = "0.4.0"
hound = "3.5.1"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

# Keep ordinary builds and tests small while retaining file/line backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = 0

# Opt in to workspace variable/type inspection when using a debugger.
[profile.debugging]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

[profile.debugging.package."*"]
debug = 0
